name: SecureGate AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Root Dependencies
      run: npm install

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm install

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Lint Code
      run: |
        cd frontend
        npm run lint --if-present

    - name: Build Backend
      run: |
        cd backend
        npm run build --if-present

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    - name: Run Backend Unit Tests
      run: |
        cd backend
        npm test --if-present

    - name: Run Playwright E2E Tests
      run: |
        cd tests
        npm install
        npx playwright install --with-deps
        npx playwright test --if-present
